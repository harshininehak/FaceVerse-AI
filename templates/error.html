
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition Failed</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .error-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            color: #dc3545;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin: 10px 5px;
            padding: 12px 20px;
            border-radius: 7px;
            text-decoration: none;
            color: white;
            background: #2563eb;
        }

        .home {
            background: #555;
        }
    </style>
</head>

<body>

    <div class="error-card">

        <div class="icon">❌</div>

        <h1>Face Not Recognised</h1>

        <p>
            We couldn't identify your face.
            Please make sure you are registered
            and try again.
        </p>

        <a href="{{ url_for('login') }}">Try Again</a>

        <a href="/" class="home">Back to Home</a>

    </div>

</body>
</html>

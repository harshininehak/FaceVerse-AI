
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | FaceVerse AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .camera-section {
            text-align: center;
            margin: 20px 0;
        }

        #video {
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            background: #111;
        }

        .camera-section button {
            margin: 8px;
            padding: 10px 18px;
            cursor: pointer;
        }

        #captureStatus {
            color: #00f0ff;
            margin: 12px 0;
        }
    </style>
</head>

<body>

<div class="form-card">

    <h2>👤 Create Your Profile</h2>

    <p style="text-align:center; color:#e2e8f0; margin-bottom:20px;">
        Register for Face Recognition Access
    </p>

    <form action="/register" method="POST" id="registerForm">

        <input type="text" name="name" placeholder="Full Name" required>

        <input type="text" name="userid" placeholder="User ID" required>

        <input type="email" name="email" placeholder="Email Address" required>

        <input type="text" name="phone" placeholder="Phone Number">

        <input type="number" name="age" placeholder="Age">

        <select name="gender">
            <option value="" disabled selected>Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <div class="camera-section">

            <h3>📸 Face Capture</h3>

            <video id="video" autoplay playsinline muted></video>

            <canvas id="canvas" style="display:none;"></canvas>

            <p id="captureStatus">Start your camera to continue.</p>

            <button type="button" id="startCamera">
                Start Camera
            </button>

            <button type="button" id="captureButton" disabled>
                Capture 30 Images
            </button>

        </div>

        <input type="hidden" name="face_images" id="faceImages">

        <button type="submit" class="submit-btn" id="submitButton" disabled>
            Register
        </button>

    </form>

</div>

<script>

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const context = canvas.getContext("2d");

    const startButton = document.getElementById("startCamera");
    const captureButton = document.getElementById("captureButton");
    const submitButton = document.getElementById("submitButton");

    const statusText = document.getElementById("captureStatus");
    const faceImagesInput = document.getElementById("faceImages");
    const registerForm = document.getElementById("registerForm");

    let cameraStream = null;
    let capturedImages = [];

    startButton.addEventListener("click", async () => {

        try {

            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: "user",
                    width: { ideal: 320 },
                    height: { ideal: 240 }
                },
                audio: false
            });

            video.srcObject = cameraStream;

            await video.play();

            captureButton.disabled = false;
            startButton.disabled = true;

            statusText.textContent =
                "Camera ready! Position your face clearly.";

        } catch (error) {

            statusText.textContent =
                "Camera access failed. Please allow camera permission.";

            console.error(error);

        }

    });


    captureButton.addEventListener("click", async () => {

        if (!cameraStream) {
            return;
        }

        capturedImages = [];

        captureButton.disabled = true;
        submitButton.disabled = true;

        // Reduce image dimensions to maximum 320 pixels wide
        const scale = Math.min(1, 320 / video.videoWidth);

        canvas.width = Math.round(video.videoWidth * scale);
        canvas.height = Math.round(video.videoHeight * scale);

        for (let i = 0; i < 30; i++) {

            context.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );

            // Compress each image to reduce upload size
            const image = canvas.toDataURL("image/jpeg", 0.5);

            capturedImages.push(image);

            statusText.textContent =
                `Capturing images: ${i + 1}/30`;

            await new Promise(resolve => setTimeout(resolve, 250));

        }

        faceImagesInput.value = JSON.stringify(capturedImages);

        statusText.textContent =
            "30 images captured! You can now register.";

        submitButton.disabled = false;
        captureButton.disabled = false;

    });


    registerForm.addEventListener("submit", (event) => {

        if (capturedImages.length !== 30) {

            event.preventDefault();

            alert("Please capture all 30 face images first.");

            return;

        }

        submitButton.disabled = true;

        statusText.textContent = "Submitting registration...";

    });


    window.addEventListener("beforeunload", () => {

        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
        }

    });

</script>

</body>
</html>
